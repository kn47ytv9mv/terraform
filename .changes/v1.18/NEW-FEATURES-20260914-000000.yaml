kind: NEW FEATURES
body: 'The experimental `enabled` meta-argument, enabled by adding `enabled_meta_argument` to the list of active experiments, permits `resource`, `data`, `ephemeral`, and `module` blocks to be conditionally created without introducing an indexed instance address. A resource using `enabled` is always addressed the same way as one with neither `count` nor `for_each` set (e.g. `aws_instance.foo`, never `aws_instance.foo[0]`). `enabled` accepts any value: null, `false`, an empty string, or an empty collection all mean disabled, and any other value (including the number `0`) means enabled - so a nullable variable can be used directly as `enabled = var.optional_thing`, with no comparison required.'
